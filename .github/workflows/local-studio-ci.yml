name: Local Studio Node regression
on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "tests/**"
      - "scripts/**"
      - "fixtures/**"
      - "package.json"
      - ".github/workflows/local-studio-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
# One current branch test run is sufficient; cancel obsolete intermediate pushes.
concurrency:
  group: local-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Node 22 unit and local HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline Studio regression tests
        run: npm test
      - name: Locate installed Chrome
        shell: bash
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER_BIN" ]; then
            echo "Chrome unavailable; real browser acceptance is mandatory" >&2
            exit 1
          fi
          echo "CHROME_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"
          "$BROWSER_BIN" --version
      - name: Run real Chrome P4 offline acceptance
        timeout-minutes: 2
        run: node tests/p4-chrome-e2e.mjs
      - name: Prove P4 measured heading typography improves independent Chrome rendering
        timeout-minutes: 2
        run: node tests/p4-heading-typography-chrome-e2e.mjs
      - name: Prove P4 observed card shadows improve independent Chrome rendering
        timeout-minutes: 2
        run: node tests/p4-card-shadow-chrome-e2e.mjs
      - name: Prove P4 compact CSS chart bar fidelity in real Chrome
        timeout-minutes: 2
        run: node tests/p4-compact-chart-chrome-e2e.mjs
      - name: Prove safe P4 two-stop linear gradient fidelity in isolated Chrome
        timeout-minutes: 2
        run: node tests/p4-linear-gradient-chrome-e2e.mjs
      - name: Run Chrome F5 bounded repair before-after acceptance
        timeout-minutes: 3
        run: node tests/p5-repair-chrome-e2e.mjs
      - name: Run Chrome F5 cross-viewport no-regression acceptance
        timeout-minutes: 3
        run: node tests/p5-multiviewport-chrome-e2e.mjs
      - name: Run Chrome F5 measured position and size repair acceptance
        timeout-minutes: 3
        run: node tests/p5-geometry-repair-chrome-e2e.mjs
      - name: Run Chrome F5 independently observed geometry alignment
        timeout-minutes: 3
        run: node tests/p5-observed-alignment-chrome-e2e.mjs
      - name: Run Chrome F5 stored independent static draft acceptance
        timeout-minutes: 3
        run: node tests/p5-independent-draft-chrome-e2e.mjs
      - name: Run Chrome F5 saved draft geometry alignment and repair acceptance
        timeout-minutes: 4
        run: node tests/p5-saved-geometry-chrome-e2e.mjs
      - name: Run real Chrome F2 controlled action causality acceptance
        timeout-minutes: 2
        run: node tests/f2-controlled-chrome-e2e.mjs
      - name: Run isolated Chrome P2 two-origin CSP and CORS proof
        timeout-minutes: 2
        run: node tests/p2-cross-origin-chrome-e2e.mjs
      - name: Run real Chrome F4 three-app branching acceptance
        timeout-minutes: 3
        run: node tests/f4-generic-chrome-e2e.mjs
      - name: Run real Chrome F3/Q1 anonymous noninteractive UI wireframe acceptance
        timeout-minutes: 3
        run: node tests/f3-q1-wireframe-chrome-e2e.mjs
      - name: Run real Chrome two-viewport F3/Q1 anonymous geometry acceptance
        timeout-minutes: 4
        run: node tests/f3-q1-geometry-preview-chrome-e2e.mjs
      - name: Run full real Chrome planner Studio-to-F5 reviewed export proof
        timeout-minutes: 3
        run: node tests/f4-planner-studio-chrome-e2e.mjs

  windows-acceptance:
    name: Windows Node ${{ matrix.node }} launcher and offline Chrome smoke
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run Windows Node and local HTTP regressions
        shell: pwsh
        run: npm test
      - name: Verify local Windows npx launcher without downloading REA
        shell: pwsh
        run: npm run check:launcher
      - name: Find installed Windows Chrome, fail closed if missing
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe')
          )
          $found = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $found) { throw "Real Chrome missing on Windows runner; do not infer browser acceptance" }
          "CHROME_BIN=$found" >> $env:GITHUB_ENV
          & $found --version
      - name: Run Windows isolated Studio smoke with existing legacy run present
        timeout-minutes: 3
        shell: pwsh
        run: |
          $legacy = Join-Path (Get-Location) 'results/studio/runs/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          New-Item -ItemType Directory -Path $legacy -Force | Out-Null
          try {
            Set-Content -LiteralPath (Join-Path $legacy 'metadata.json') -Value '{"id":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","status":"completed"}'
            node scripts/windows-studio-startup-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Isolated Windows Studio smoke failed" }
          } finally {
            Remove-Item -LiteralPath $legacy -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Run real Windows Chrome P4 offline acceptance
        timeout-minutes: 4
        shell: pwsh
        run: node tests/p4-chrome-e2e.mjs
      - name: Run real Windows Chrome saved-draft F5 geometry acceptance
        timeout-minutes: 8
        shell: pwsh
        run: node tests/p5-saved-geometry-chrome-e2e.mjs
      - name: Run owner-style one-command local acceptance on Windows
        timeout-minutes: 7
        shell: pwsh
        run: npm run accept:local
